name: User tag release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py validate
  builds:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit
  publish:
    needs: [version, builds]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: afd-*
          path: dist
          merge-multiple: true
      - name: Validate complete artifact set and generate checksums
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: python3 scripts/release.py prepare
      - name: Publish once, from this user-pushed tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: python3 scripts/release.py publish
